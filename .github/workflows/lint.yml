name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Detekt
        run: ./gradlew detekt --console=plain
      - name: Disabled tests cite a ticket
        run: ./gradlew verifyTestAnnotations --console=plain
