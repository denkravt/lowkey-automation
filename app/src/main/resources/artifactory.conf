# Optional artifact source. When baseUrl is empty the local apkPath is used.
artifactory {
  baseUrl = ""
  baseUrl = ${?ARTIFACT_REPO_URL}
  artifactPattern = "lowkey-cam/%2$s/lowkey-%1$s.apk"
  artifactVersion = "latest"
  artifactVersion = ${?ARTIFACT_VERSION}
  username = ${?ARTIFACT_USER}
  apiKey = ${?ARTIFACT_TOKEN}
  downloadDir = "build/downloads"
}
