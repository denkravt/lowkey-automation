# iOS product configuration. Scaffolded: screens and tests compile but are not run here.
ios {
  bundleId = "com.justan.lowkeycam"
  bundleId = ${?IOS_BUNDLE_ID}

  app {
    appPath = ""
    appPath = ${?APP_SOURCE}
    # ~ is expanded before the path reaches xcodebuild.
    wdaBootstrapPath = "~/Library/Developer/Xcode/DerivedData"
    wdaBootstrapPath = ${?WDA_BOOTSTRAP_PATH}
    team = ""
    team = ${?APPLE_TEAM_ID}
  }

  device {
    # Empty => resolve the first physical device through ideviceinfo.
    udid = ""
    udid = ${?IOS_DEVICE_UDID}
  }

  run {
    usePrebuiltWDA = true
    autoLaunch = false
    enableXcodeDebug = false
    enableXcodeDebug = ${?ENABLE_XCODE_DEBUG}
  }
}
