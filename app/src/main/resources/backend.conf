# LowKey has no backend. The Retrofit client exists for products that do; leave these empty to disable it.
backend {
  baseUrl = ""
  baseUrl = ${?BACKEND_BASE_URL}
  authType = "none"
  authType = ${?BACKEND_AUTH_TYPE}
  connectTimeoutSeconds = 15
  readTimeoutSeconds = 30
  logBodies = false
  logBodies = ${?BACKEND_LOG_BODIES}
}
