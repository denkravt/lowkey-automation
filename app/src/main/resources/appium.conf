# Appium server + shared timing policy.
appium {
  serverUrl = "http://127.0.0.1:4723"
  serverUrl = ${?APPIUM_SERVER_URL}

  startupTimeoutSeconds = 90
  startupTimeoutSeconds = ${?APPIUM_STARTUP_TIMEOUT}

  # Locator polling defaults (see shared/waitstrategy/PollingWaitStrategy).
  locator {
    timeoutMs = 15000
    timeoutMs = ${?LOCATOR_TIMEOUT_MS}
    pollIntervalMs = 500
  }

  interAppTimeoutMs = 10000
  permissionTimeoutMs = 5000

  # -DskipAppiumKill=true keeps the server alive for local debugging.
  killOnExit = true
  killOnExit = ${?APPIUM_KILL_ON_EXIT}

  logDir = "build/appium-logs"
  logDir = ${?APPIUM_LOG_DIR}
}
