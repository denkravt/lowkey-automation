# Android product configuration for LowKey.
android {
  appPackage = "com.justan.lowkeycam"
  appPackage = ${?ANDROID_APP_PACKAGE}
  appActivity = ".MainActivity"

  app {
    # Relative paths resolve against the repo root; APP_SOURCE wins when set.
    apkPath = "../lowkey-cam/app/build/outputs/apk/debug/app-debug.apk"
    apkPath = ${?APP_SOURCE}
    remotePath = "/data/local/tmp/lowkey-automation/app-under-test.apk"
  }

  device {
    # Empty => first physical device reported by `adb devices`.
    udid = ""
    udid = ${?DEVICE_UDID}
    requirePhysicalDevice = true
    requirePhysicalDevice = ${?REQUIRE_PHYSICAL_DEVICE}
  }

  run {
    fullReset = true
    autoGrantPermissions = true
    newCommandTimeoutSeconds = 180
    enableScreenRecording = true
    enableScreenRecording = ${?ENABLE_SCREEN_RECORDING}
    screenRecordingBitRate = "4M"
    screenRecordingTimeLimitSeconds = 180
  }
}
